<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>包裹管家 · 管理后台</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="logo" aria-hidden="true"><svg viewBox="0 0 1024 1024" fill="currentColor"><path d="M1007.99 236.38a29.823 29.823 0 0 0-6.7-3.14L524.96 5.01a29.988 29.988 0 0 0-25.93 0L21.25 233.95c-1.79 0.69-3.53 1.56-5.18 2.6a29.966 29.966 0 0 0-11.33 13.02c-0.09 0.19-0.17 0.38-0.25 0.57-0.15 0.35-0.3 0.71-0.44 1.07-0.14 0.37-0.28 0.74-0.41 1.12-0.05 0.16-0.11 0.32-0.16 0.49-0.96 2.94-1.48 6.05-1.48 9.24 0 0.49 0.03 0.98 0.05 1.47v498.4c0 11.54 6.62 22.07 17.04 27.05l480 230c4.11 1.97 8.54 2.95 12.96 2.95 5.46 0 10.9-1.5 15.69-4.44l477.22-228.67a30.006 30.006 0 0 0 17.04-27.05v-500c0-10.31-5.29-19.89-14.01-25.39zM512 65.33l410.27 196.59-410.42 196.65-410.26-196.58L512 65.33zM62.05 309.73L482 510.96v433.31L62.05 743.04V309.73z m480 634.37V510.93L962 309.71v433.17L542.05 944.1z"/><path d="M365.02 556.98l-160-76.67c-14.94-7.16-32.86-0.85-40.02 14.09-7.16 14.94-0.85 32.86 14.09 40.02l160 76.67c4.18 2 8.59 2.95 12.94 2.95 11.18 0 21.92-6.28 27.08-17.04 7.16-14.95 0.85-32.86-14.09-40.02z"/></svg></span>
        <div class="brand-text">
          <h1>包裹管家 · 管理后台</h1>
          <p>导入手机 App 导出的 JSON，在本机查看与导出全部经营数据</p>
        </div>
      </div>
      <div class="actions">
        <button id="btn-import" class="btn primary" type="button">导入 JSON</button>
        <button id="btn-clear" class="btn danger" type="button" disabled>清空数据</button>
      </div>
    </header>

    <input id="file-input" type="file" accept=".json,application/json" hidden />

    <main>
      <section id="empty" class="empty">
        <div id="drop-zone" class="drop-zone">
          <div class="drop-icon">⇪</div>
          <h2>把 App 导出的 JSON 拖到这里</h2>
          <p>也可以点击选择文件，数据会保存在本机浏览器，下次打开自动恢复。</p>
          <button id="btn-import-empty" class="btn primary big" type="button">
            选择 JSON 文件
          </button>
          <span class="drop-hint">App 路径：工作概览 → 右上角“数据备份” → 导出 JSON</span>
        </div>
      </section>

      <section id="report" hidden>
        <div id="meta" class="meta"></div>

        <nav id="tabs" class="tabs">
          <button type="button" data-tab="overview" class="active">概览</button>
          <button type="button" data-tab="orders">订单</button>
          <button type="button" data-tab="parcels">包裹</button>
          <button type="button" data-tab="shipments">转寄</button>
          <button type="button" data-tab="accounts">账号</button>
          <button type="button" data-tab="platforms">平台</button>
          <button type="button" data-tab="products">商品</button>
          <button type="button" data-tab="audit">审计</button>
        </nav>

        <section id="panel-overview" class="panel">
          <div class="range-bar">
            <div>
              <h2>经营分析</h2>
              <p id="range-hint" class="range-hint"></p>
            </div>
            <div class="range-actions">
              <div id="range-group" class="segmented">
                <button type="button" data-range="all" class="active">全部</button>
                <button type="button" data-range="month">本月</button>
                <button type="button" data-range="quarter">近3月</button>
                <button type="button" data-range="year">本年</button>
              </div>
              <button id="btn-export-summary" class="btn" type="button">
                导出汇总 CSV
              </button>
            </div>
          </div>

          <div id="kpis" class="kpis"></div>

          <div class="grid two">
            <section class="card">
              <div class="card-head">
                <h3>平台表现</h3>
                <span class="card-tip">按订单金额汇总</span>
              </div>
              <div id="platform-table" class="table-wrap"></div>
            </section>
            <section class="card">
              <div class="card-head">
                <h3>账号表现</h3>
                <span class="card-tip">按订单金额汇总</span>
              </div>
              <div id="account-table" class="table-wrap"></div>
            </section>
          </div>

          <section class="card">
            <div class="card-head">
              <h3>近 12 个月销售趋势</h3>
              <span class="card-tip">柱高为销售额，括号内为订单数</span>
            </div>
            <div id="trend" class="bar-chart"></div>
          </section>

          <div class="grid two">
            <section class="card">
              <div class="card-head"><h3>包裹状态</h3></div>
              <div id="parcel-status" class="stat-list"></div>
            </section>
            <section class="card">
              <div class="card-head"><h3>快递公司分布</h3></div>
              <div id="carrier" class="stat-list"></div>
            </section>
          </div>

          <section class="card">
            <div class="card-head">
              <h3>待补物流单号</h3>
              <span class="card-tip">下单后尚未回填物流单号的订单</span>
            </div>
            <div id="pending-orders" class="table-wrap"></div>
          </section>
        </section>

        <section id="panel-orders" class="panel" hidden>
          <div class="toolbar">
            <input id="orders-search" class="search" type="search"
              placeholder="搜索标题、单号、地址或账号" />
            <select id="orders-platform" class="select"></select>
            <span id="orders-count" class="toolbar-tip"></span>
            <button id="orders-export" class="btn" type="button">导出筛选结果 CSV</button>
          </div>
          <section class="card">
            <div id="orders-table" class="table-wrap"></div>
          </section>
        </section>

        <section id="panel-parcels" class="panel" hidden>
          <div class="toolbar">
            <input id="parcels-search" class="search" type="search"
              placeholder="搜索运单号、快递公司或备注" />
            <select id="parcels-status" class="select">
              <option value="">全部状态</option>
              <option value="pending">待认领</option>
              <option value="assigned">已分配</option>
              <option value="inbound">已入库</option>
              <option value="outbound">已转寄</option>
              <option value="done">已完成</option>
              <option value="exception">异常件</option>
            </select>
            <span id="parcels-count" class="toolbar-tip"></span>
            <button id="parcels-export" class="btn" type="button">导出筛选结果 CSV</button>
          </div>
          <section class="card">
            <div id="parcels-table" class="table-wrap"></div>
          </section>
        </section>

        <section id="panel-shipments" class="panel" hidden>
          <div class="toolbar">
            <input id="shipments-search" class="search" type="search"
              placeholder="搜索快递公司、运单号或备注" />
            <span id="shipments-count" class="toolbar-tip"></span>
            <button id="shipments-export" class="btn" type="button">导出筛选结果 CSV</button>
          </div>
          <section class="card">
            <div id="shipments-table" class="table-wrap"></div>
          </section>
        </section>

        <section id="panel-accounts" class="panel" hidden>
          <div class="toolbar">
            <input id="accounts-search" class="search" type="search"
              placeholder="搜索账号别名或备注" />
            <select id="accounts-platform" class="select"></select>
            <span id="accounts-count" class="toolbar-tip"></span>
            <button id="accounts-export" class="btn" type="button">导出筛选结果 CSV</button>
          </div>
          <section class="card">
            <div id="accounts-table" class="table-wrap"></div>
          </section>
        </section>

        <section id="panel-platforms" class="panel" hidden>
          <div class="toolbar">
            <input id="platforms-search" class="search" type="search" placeholder="搜索平台名称" />
            <span id="platforms-count" class="toolbar-tip"></span>
            <button id="platforms-export" class="btn" type="button">导出筛选结果 CSV</button>
          </div>
          <section class="card">
            <div id="platforms-table" class="table-wrap"></div>
          </section>
        </section>

        <section id="panel-products" class="panel" hidden>
          <div class="toolbar">
            <input id="products-search" class="search" type="search"
              placeholder="搜索商品名称、规格或备注" />
            <span id="products-count" class="toolbar-tip"></span>
            <button id="products-export" class="btn" type="button">导出筛选结果 CSV</button>
          </div>
          <section class="card">
            <div id="products-table" class="table-wrap"></div>
          </section>
        </section>

        <section id="panel-audit" class="panel" hidden>
          <div class="toolbar">
            <input id="audit-search" class="search" type="search"
              placeholder="搜索动作、对象或详情" />
            <span id="audit-count" class="toolbar-tip"></span>
            <button id="audit-export" class="btn" type="button">导出筛选结果 CSV</button>
          </div>
          <section class="card">
            <div id="audit-table" class="table-wrap"></div>
          </section>
        </section>
      </section>
    </main>

    <footer>
      数据仅保存在本机浏览器（IndexedDB），不会上传到任何服务器。关闭页面后再次打开同一地址即可继续查看。
    </footer>

    <div id="toast" class="toast" hidden></div>

    <script src="app.js"></script>
  </body>
</html>
